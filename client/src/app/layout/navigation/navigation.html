<mat-toolbar color="primary">
  <span class="logo" id="navMainLink" routerLink="/main">InstaZoo</span>
  <span class="spacer"></span>
  @if(!isLoggedIn){
    <button matTooltip="Login" routerLink="/login" mat-icon-button class="example-icon favorite-icon">
      <mat-icon>login</mat-icon>
    </button>
  }
  @if(isDataLoaded){
    <h3>{{this.user.firstname}} {{this.user.lastname}}</h3>
  }
  @if(isLoggedIn){
    <button [matMenuTriggerFor]="menu" matTooltip="Profile" mat-icon-button>
      <mat-icon color="accent">account_box</mat-icon>
    </button>
    <mat-menu id="menu-item" #menu="matMenu">
      <button mat-menu-item routerLink="/profile">Profile</button>
      <button mat-menu-item (click)="logout()">
        Logout
      </button>

    </mat-menu>
  }


</mat-toolbar>
