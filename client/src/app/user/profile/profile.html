@if (user) {
  <div class="user-profile">
    <h1>Profile</h1>

    <div class="edit-button-container">
      <button mat-flat-button color="primary" (click)="openEditDialog()">Edit Info</button>
    </div>

    <div class="profile-content">
      <div class="col">
        <img class="profile-image"
             [src]="previewImageURL || formatImage(userProfileImage) || '/profile-image.jpg'"
             alt="user image">

        <input type="file"
               class="file-input"
               #fileInput
               (change)="onFileSelected($event)">

        <div class="file-buttons">
          <button mat-button (click)="fileInput.click()">Pick File</button>

          @if (selectedFile) {
            <button mat-button color="primary" (click)="onUpload()">Upload</button>
          }
        </div>
      </div>

      <div class="col">
        <h2>{{ user.username }}</h2>
        <h3>{{ user.firstname }} {{ user.lastname }}</h3>
        <p>{{ user.bio }}</p>
      </div>
    </div>

    <mat-divider class="divider"></mat-divider>

    <router-outlet></router-outlet>
  </div>
} @else {
  <div class="loadingProfile">
    <p>Загрузка профиля...</p>
  </div>
}
